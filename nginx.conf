# The site inside the container, on the same ports as the old host nginx (itproductcatalog, 10.10.4.78):
#   443  https for smart.tkc-services.com (certificate with its chain and key mounted by docker-compose.yml)
#   8080 plain http, as the old "localhost" site had: the main website reverse-proxies to it, so no redirect here
#   80   http, sent on to https (new: the old server did not listen on 80)
# Every route of the app (/solutions/...) falls back to index.html, like public/_redirects on Netlify.
root  /usr/share/nginx/html;
index index.html;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name smart.tkc-services.com _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # the page itself is never cached, so a new deploy shows at once; other files are rechecked every hour
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}

server {
    listen 8080;
    server_name _;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
